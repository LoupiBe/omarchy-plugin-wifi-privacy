# /etc/NetworkManager/conf.d/30-wifi-privacy.conf
# Managed by omarchy-plugin-wifi-privacy

[device-mac-randomization]
# Randomize MAC during 802.11 probe scanning to defeat location tracking beacons
wifi.scan-rand-mac-address=yes

[connection-mac-randomization]
# Default to random MAC for all new/untrusted Wi-Fi connections
wifi.cloned-mac-address=random
ethernet.cloned-mac-address=preserve

[connection-privacy]
# RFC 4941: Generate rotating temporary randomized IPv6 addresses for outbound internet traffic
ipv6.ip6-privacy=2

# Do not leak system hostname by default to unknown DHCP servers
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
